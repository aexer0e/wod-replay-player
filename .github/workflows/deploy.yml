name: Deploy site

# Builds the replay player from aexer0e/more-of-dots and publishes it to GitHub
# Pages. more-of-dots requests a build when its VERSION changes, a push that
# changes a tournament rebuilds with the current more-of-dots, and a manual run
# builds any branch, tag or commit.
on:
  repository_dispatch:
    types: [more-of-dots-updated]
  push:
    branches: [main]
    paths: ["tournaments/**", "maps/**"]
  workflow_dispatch:
    inputs:
      ref:
        description: more-of-dots branch, tag or commit
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out the sound files, maps and tournaments
        uses: actions/checkout@v4
        with:
          path: site

      - name: Check out more-of-dots
        uses: actions/checkout@v4
        with:
          repository: aexer0e/more-of-dots
          ref: ${{ github.event.client_payload.sha || inputs.ref || 'main' }}
          path: app

      - name: Install the WebAssembly target for Rust
        run: rustup target add wasm32-unknown-unknown

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install JavaScript dependencies
        working-directory: app
        run: npm ci

      - name: Build the site
        working-directory: app
        run: node scripts/build-site.mjs --audio ../site/audio --maps ../site/maps --tournaments ../site/tournaments

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
